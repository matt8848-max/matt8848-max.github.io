name: Deploy Dioxus site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Dioxus 应用位于仓库根下的 webpage/ 子目录
        working-directory: webpage
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: webpage -> target

      # dx 会自动下载 wasm-bindgen / wasm-opt / esbuild / tailwindcss，无需额外步骤
      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      # build.rs 会调用 mdbook 构建 mdbooks/ 下的书籍（本地已安装；CI 需显式安装）
      # 版本需与本地保持一致，避免产物差异
      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      # 渲染 ```mermaid 图需要 mdbook-mermaid 预处理器本体（本地 0.17.1，版本需对齐避免产物差异）
      - name: Install mdbook-mermaid
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook-mermaid@0.17.1

      # mermaid.min.js / mermaid-init.js 是 `mdbook-mermaid install` 的生成物（已 gitignore、不入库）
      # 云端对每本声明了 [preprocessor.mermaid] 的书重新生成（对已配置的书是幂等的）
      # 注：run 步骤沿用 job 默认工作目录 webpage/，故用 ../mdbooks 指向仓库根
      - name: Generate mdbook-mermaid assets
        run: |
          for book_toml in ../mdbooks/*/book.toml; do
            if grep -q '^\[preprocessor\.mermaid\]' "$book_toml"; then
              mdbook-mermaid install "$(dirname "$book_toml")"
            fi
          done

      - name: Build web app
        run: dx build --release --platform web

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # dx build 产物固定路径：target/dx/<bin名>/release/web/public
          path: webpage/target/dx/webpage/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
